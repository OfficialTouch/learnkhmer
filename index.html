<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Khmer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1d1b18; --muted:#6b655c; --accent:#b4541d; --soft:#f6e6da; --ok:#2e7d4f; --bad:#b3261e; --line:#e6dfd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171513; --card:#221f1c; --ink:#f1ece4; --muted:#a39b8f; --accent:#e8874a; --soft:#3a2a20; --ok:#5cc28a; --bad:#ef7a72; --line:#3a352f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; }
  .top { display:flex; align-items:center; gap:8px; max-width:900px; margin:0 auto; }
  .top h1 { font-size:18px; margin:0 auto 0 0; }
  .top h1 a { color:inherit; text-decoration:none; }
  nav { display:flex; gap:6px; overflow-x:auto; max-width:900px; margin:8px auto 0; scrollbar-width:none; }
  nav a, select { font:inherit; font-size:14px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; white-space:nowrap; }
  nav a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .narrow { max-width:680px; margin:0 auto; }
  .hint { color:var(--muted); }
  a { color:var(--accent); }
  .card, .lesson { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px; color:var(--ink); font:inherit; text-decoration:none; }
  .lesson { display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
  .lesson span { color:var(--muted); white-space:nowrap; }
  .lesson small { display:block; color:var(--muted); font-weight:400; }
  .lesson:disabled { opacity:.5; cursor:default; }
  h3.level { margin:24px 0 10px; color:var(--accent); font-size:15px; text-transform:uppercase; letter-spacing:.06em; }
  .rom { font-size:22px; font-weight:600; }
  .km, .kmi { font-family:'Noto Sans Khmer', sans-serif; }
  .km { color:var(--muted); font-size:15px; }
  .kmi { font-size:1.15em; }
  .en { margin-top:2px; }
  .note { color:var(--muted); font-size:14px; font-style:italic; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .btn { font:inherit; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.sm { padding:6px 12px; font-size:14px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn:disabled { opacity:.6; cursor:default; }
  .big { text-align:center; padding:28px 16px; }
  .big .rom { font-size:30px; }
  .opts .btn { width:100%; margin-bottom:8px; text-align:left; }
  audio { height:36px; max-width:100%; }
  input, textarea { font:inherit; width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  /* home */
  .hero { text-align:center; padding:40px 8px 28px; }
  .hero .kh { font-family:'Noto Sans Khmer', sans-serif; font-size:44px; color:var(--accent); line-height:1.3; }
  .hero h2 { font-size:clamp(26px, 6vw, 40px); margin:8px 0; line-height:1.15; }
  .hero p { color:var(--muted); max-width:520px; margin:0 auto 18px; }
  .hero .row { justify-content:center; }
  .features { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .features .card { margin:0; }
  .features b { display:block; font-size:17px; }
  .features span { color:var(--muted); font-size:15px; }
  /* course */
  .lesson-text h4 { margin:18px 0 4px; font-size:17px; }
  .lesson-text p { margin:0; }
  .item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item .play { flex:none; width:40px; height:40px; border-radius:50%; padding:0; }
  .item b { display:block; }
  .item .km { font-size:16px; }
  .tokens { display:flex; flex-wrap:wrap; gap:8px; min-height:48px; padding:8px; border:1px dashed var(--line); border-radius:12px; margin:8px 0; }
  .tokens .btn { padding:8px 12px; }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:12px; }
  .progress div { height:100%; background:var(--accent); }
  /* alphabet + games */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 4px; color:var(--ink); font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; }
  .tile .glyph { font-family:'Noto Sans Khmer', sans-serif; font-size:34px; line-height:1.4; }
  .tile small { color:var(--muted); font-size:12px; }
  .tile.o { background:var(--soft); }
  .tile.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .match { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .match .tile { min-height:60px; justify-content:center; text-align:center; padding:8px; }
  .match .tile.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .match .tile.done { opacity:.35; cursor:default; }
  .match .tile.wrong { border-color:var(--bad); box-shadow:0 0 0 2px var(--bad); }
  /* verbs */
  .vrow { display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; }
  .vrow .lbl { font-size:13px; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; }
  .mk { color:var(--accent); font-weight:700; }
  /* tutor */
  .chat { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; }
  .msg.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .composer { display:flex; gap:8px; align-items:flex-end; position:sticky; bottom:0; background:var(--bg); padding:8px 0; }
  .composer textarea { resize:none; height:46px; }
  /* keyboard + worksheets */
  .kb { display:grid; grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); gap:4px; }
  .kb button { font-family:'Noto Sans Khmer', sans-serif; font-size:22px; padding:6px 0; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .kbtext { font-family:'Noto Sans Khmer', sans-serif; font-size:26px; min-height:90px; }
  .sheet .srow { display:flex; gap:6px; margin-bottom:6px; break-inside:avoid; }
  .sheet .cell { flex:1; aspect-ratio:1; border:1px solid #bbb; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Noto Sans Khmer', sans-serif; font-size:44px; color:#000; background:#fff; }
  .sheet .cell.trace { color:#d4d4d4; }
  @media print {
    header, .noprint { display:none !important; }
    body, main { background:#fff; padding:0; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><a href="#home">Learn Khmer</a></h1>
    <select id="voice" aria-label="Voice">
      <option value="f">Female voice</option>
      <option value="m">Male voice</option>
    </select>
  </div>
  <nav>
    <a href="#home">Home</a>
    <a href="#course">Course</a>
    <a href="#phrases">Phrases</a>
    <a href="#alphabet">Alphabet</a>
    <a href="#verbs">Verbs</a>
    <a href="#practice">Practice</a>
    <a href="#tutor">AI Tutor</a>
    <a href="#tools">Tools</a>
    <a href="#culture">Culture</a>
  </nav>
</header>
<main id="main">Loading…</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Khmer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1d1b18; --muted:#6b655c; --accent:#b4541d; --ok:#2e7d4f; --bad:#b3261e; --line:#e6dfd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171513; --card:#221f1c; --ink:#f1ece4; --muted:#a39b8f; --accent:#e8874a; --ok:#5cc28a; --bad:#ef7a72; --line:#3a352f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  nav button, select { font:inherit; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .hint { color:var(--muted); }
  .card, .lesson { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px; color:var(--ink); font:inherit; }
  .lesson { display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
  .lesson span { color:var(--muted); }
  .lesson:disabled { opacity:.5; cursor:default; }
  .rom { font-size:22px; font-weight:600; }
  .km { font-family:'Noto Sans Khmer', sans-serif; color:var(--muted); font-size:15px; }
  .en { margin-top:2px; }
  .note { color:var(--muted); font-size:14px; font-style:italic; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .btn { font:inherit; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  .big { text-align:center; padding:28px 16px; }
  .big .rom { font-size:30px; }
  .opts .btn { width:100%; margin-bottom:8px; text-align:left; }
  audio { height:36px; max-width:100%; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <h1>Learn Khmer</h1>
  <nav>
    <button data-v="lessons">Lessons</button>
    <button data-v="review">Review</button>
    <button data-v="quiz">Quiz</button>
  </nav>
  <select id="voice" aria-label="Voice">
    <option value="f">Female voice</option>
    <option value="m">Male voice</option>
  </select>
</header>
<main id="main">Loading…</main>
<!-- Lessons: edit here. Each lesson is one "Day". -->
<script id="phrases" type="application/json">
[

      {"id": "thank-you", "km": "អរគុណ", "rom": "arkun", "en": "Thank you"},

      {"id": "how-are-you", "km": "សុខសប្បាយទេ?", "rom": "sok sabaay te?", "en": "How are you?"},
      {"id": "im-fine", "km": "ខ្ញុំសុខសប្បាយ", "rom": "khnhom sok sabaay", "en": "I'm fine"},

      {"id": "good-morning", "km": "អរុណសួស្តី", "rom": "arun suosdei", "en": "Good morning"},
      {"id": "good-night", "km": "រាត្រីសួស្តី", "rom": "reatrei suosdei", "en": "Good night"}
    ]

    "items": [
      {"id": "family", "km": "គ្រួសារ", "rom": "kruosaa", "en": "Family"},
      {"id": "mom", "km": "ម៉ែ", "rom": "mae", "en": "Mom"},

  {

    "items": [
      {"id": "where-going", "km": "ទៅណា?", "rom": "tov na?", "en": "Where are you going?"},

      {"id": "sit", "km": "អង្គុយ", "rom": "angkuy", "en": "Sit down"},
      {"id": "wait", "km": "ចាំបន្តិច", "rom": "cham bantech", "en": "Wait a moment"},
      {"id": "dont-understand", "km": "ខ្ញុំមិនយល់ទេ", "rom": "khnhom min yol te", "en": "I don't understand"},
      {"id": "speak-slowly", "km": "និយាយយឺតៗ", "rom": "niyeay yuet yuet", "en": "Speak slowly"},
      {"id": "again", "km": "ម្តងទៀត", "rom": "mdong tiet", "en": "One more time"},

    "items": [
      {"id": "love-you", "km": "ខ្ញុំស្រលាញ់អ្នក", "rom": "khnhom srolanh neak", "en": "I love you"},
      {"id": "miss-you", "km": "ខ្ញុំនឹកអ្នក", "rom": "khnhom nuek neak", "en": "I miss you"},
      {"id": "happy", "km": "ខ្ញុំសប្បាយចិត្ត", "rom": "khnhom sabaay chet", "en": "I'm happy"},
      {"id": "tired", "km": "ខ្ញុំហត់", "rom": "khnhom hot", "en": "I'm tired"},
      {"id": "very-good", "km": "ល្អណាស់", "rom": "l'or nas", "en": "Very good"},
      {"id": "no-problem", "km": "អត់អីទេ", "rom": "ot ei te", "en": "It's okay / No problem"},
      {"id": "sleep-well", "km": "គេងលក់ស្រួល", "rom": "keng lok sruol", "en": "Sleep well"}
    ]
  }
]
</script>
<script>
const main = document.getElementById('main');
const DAY = 864e5, GAPS = [0, 1, 3, 7, 14, 30, 90]; // review gap in days per box
let LESSONS = [], BY_ID = {};
let srs = load('srs', {});   // id -> {box, due}
let done = load('done', []); // finished lesson indexes
let voice = load('voice', 'f');

function load(k, d) { try { return JSON.parse(localStorage.getItem('km-' + k)) ?? d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem('km-' + k, JSON.stringify(v)); } catch {} }
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

function play(item) {
  const a = new Audio(`audio/${item.id}-${voice}.mp3`);
  a.play().catch(() => {
    // shortcut: browser voice fallback until the audio files exist; most devices have no Khmer voice
    const u = new SpeechSynthesisUtterance(item.km); u.lang = 'km-KH'; speechSynthesis.speak(u);
  });
  return a;
}

function phraseHTML(it) {
  return `<div class="rom">${it.rom}</div><div class="km">${it.km}</div><div class="en">${it.en}</div>` +
    (it.note ? `<div class="note">${it.note}</div>` : '');
}

// ---- Lessons ----
function lessons() {
  main.innerHTML = `<p class="hint">One lesson a day, then clear your reviews. Say every phrase out loud.</p>` +
    LESSONS.map((l, i) => {
      const locked = i > 0 && !done.includes(i - 1);
      const status = done.includes(i) ? '✓ done' : locked ? '🔒' : `${l.items.length} phrases`;
      return `<button class="lesson" data-i="${i}" ${locked ? 'disabled' : ''}><b>Day ${i + 1}: ${l.title}</b><span>${status}</span></button>`;
    }).join('');
  main.querySelectorAll('.lesson').forEach(b => b.onclick = () => lesson(+b.dataset.i));
}

function lesson(i) {
  const l = LESSONS[i];
  main.innerHTML = `<h2>Day ${i + 1}: ${l.title}</h2><p class="hint">Play, repeat out loud, then record yourself to compare.</p>` +
    l.items.map(it => `<div class="card">${phraseHTML(it)}
      <div class="row"><button class="btn" data-play="${it.id}">▶ Play</button>
      <button class="btn" data-rec="${it.id}">🎙 Record</button><span id="out-${it.id}"></span></div></div>`).join('') +
    `<button class="btn primary" id="finish">Finish lesson → review</button>`;
  main.querySelectorAll('[data-play]').forEach(b => b.onclick = () => play(BY_ID[b.dataset.play]));
  main.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => record(BY_ID[b.dataset.rec], b));
  document.getElementById('finish').onclick = () => {
    if (!done.includes(i)) done.push(i);
    l.items.forEach(it => srs[it.id] ??= { box: 0, due: 0 });
    save('done', done); save('srs', srs); show('review');
  };
}

// ---- Listen & repeat ----
let rec;
async function record(item, btn) {
  if (rec?.state === 'recording') return rec.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      btn.textContent = '🎙 Record';
      const mine = document.createElement('audio');
      mine.controls = true;
      mine.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      document.getElementById('out-' + item.id).replaceChildren(mine);
      play(item).onended = () => mine.play(); // native speaker first, then you
    };
    rec.start();
    btn.textContent = '⏹ Stop';
  } catch {
    alert('Microphone not available. Allow mic access (needs https or localhost).');
  }
}

// ---- Review (spaced repetition) ----
function review() {
  const queue = shuffle(Object.keys(srs).filter(id => srs[id].due <= Date.now()));
  const next = () => {
    if (!queue.length) {
      main.innerHTML = `<div class="card big"><div class="rom">All caught up 🎉</div>
        <p class="hint">${Object.keys(srs).length ? 'Come back tomorrow, or start the next lesson.' : 'Finish a lesson to get cards to review.'}</p></div>`;
      return;
    }
    const it = BY_ID[queue[0]];
    main.innerHTML = `<p class="hint">${queue.length} left. Say it in Khmer, then reveal.</p>
      <div class="card big"><div class="rom">${it.en}</div><div id="ans"></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="reveal">Reveal</button></div></div>`;
    document.getElementById('reveal').onclick = () => {
      document.getElementById('ans').innerHTML = `<hr>${phraseHTML(it).replace(`<div class="en">${it.en}</div>`, '')}`;
      play(it);
      document.getElementById('reveal').parentElement.innerHTML =
        `<button class="btn" id="rep">▶</button><button class="btn bad" id="again">Again</button><button class="btn ok" id="good">Got it</button>`;
      document.getElementById('rep').onclick = () => play(it);
      document.getElementById('again').onclick = () => { grade(it.id, false); queue.push(queue.shift()); next(); };
      document.getElementById('good').onclick = () => { grade(it.id, true); queue.shift(); next(); };
    };
  };
  next();
}

function grade(id, ok) {
  const box = ok ? Math.min(srs[id].box + 1, GAPS.length - 1) : 0;
  srs[id] = { box, due: Date.now() + GAPS[box] * DAY };
  save('srs', srs);
}

// ---- Listening quiz ----
function quiz() {
  const pool = Object.keys(srs).map(id => BY_ID[id]).filter(Boolean);
  if (pool.length < 4) {
    main.innerHTML = `<div class="card big"><p class="hint">Finish your first lesson to unlock the quiz.</p></div>`;
    return;
  }
  let right = 0, total = 0;
  const ask = () => {
    const it = pool[Math.floor(Math.random() * pool.length)];
    const opts = shuffle([it, ...shuffle(pool.filter(p => p !== it)).slice(0, 3)]);
    main.innerHTML = `<p class="hint">Score: ${right}/${total}. Listen and pick the meaning.</p>
      <div class="card big"><button class="btn primary" id="hear">▶ Play again</button></div>
      <div class="opts">${opts.map(o => `<button class="btn" data-id="${o.id}">${o.en}</button>`).join('')}</div>`;
    document.getElementById('hear').onclick = () => play(it);
    play(it);
    main.querySelectorAll('.opts .btn').forEach(b => b.onclick = () => {
      total++;
      const ok = b.dataset.id === it.id;
      if (ok) right++;
      main.querySelectorAll('.opts .btn').forEach(x => { x.disabled = true; if (x.dataset.id === it.id) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      document.getElementById('hear').parentElement.innerHTML += `<div style="margin-top:12px">${phraseHTML(it)}</div>`;
      setTimeout(ask, ok ? 1200 : 3000);
    });
  };
  ask();
}

// ---- Nav ----
const VIEWS = { lessons, review, quiz };
function show(v) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  VIEWS[v]();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));
const sel = document.getElementById('voice');
sel.value = voice;
sel.onchange = () => { voice = sel.value; save('voice', voice); };

LESSONS = JSON.parse(document.getElementById('phrases').textContent);
LESSONS.forEach(l => l.items.forEach(it => BY_ID[it.id] = it));
show('lessons');
</script>
</body>
</html>

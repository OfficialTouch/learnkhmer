<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Khmer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1d1b18; --muted:#6b655c; --accent:#b4541d; --soft:#f6e6da; --ok:#2e7d4f; --bad:#b3261e; --line:#e6dfd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171513; --card:#221f1c; --ink:#f1ece4; --muted:#a39b8f; --accent:#e8874a; --soft:#3a2a20; --ok:#5cc28a; --bad:#ef7a72; --line:#3a352f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; }
  .top { display:flex; align-items:center; gap:8px; max-width:900px; margin:0 auto; }
  .top h1 { font-size:18px; margin:0 auto 0 0; }
  .top h1 a { color:inherit; text-decoration:none; }
  nav { display:flex; gap:6px; overflow-x:auto; max-width:900px; margin:8px auto 0; scrollbar-width:none; }
  nav a, select { font:inherit; font-size:14px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; white-space:nowrap; }
  nav a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .narrow { max-width:640px; margin:0 auto; }
  .hint { color:var(--muted); }
  .card, .lesson { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px; color:var(--ink); font:inherit; text-decoration:none; }
  .lesson { display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
  .lesson span { color:var(--muted); white-space:nowrap; }
  .lesson:disabled { opacity:.5; cursor:default; }
  h3.level { margin:24px 0 10px; color:var(--accent); font-size:15px; text-transform:uppercase; letter-spacing:.06em; }
  .rom { font-size:22px; font-weight:600; }
  .km { font-family:'Noto Sans Khmer', sans-serif; color:var(--muted); font-size:15px; }
  .en { margin-top:2px; }
  .note { color:var(--muted); font-size:14px; font-style:italic; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .btn { font:inherit; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  .big { text-align:center; padding:28px 16px; }
  .big .rom { font-size:30px; }
  .opts .btn { width:100%; margin-bottom:8px; text-align:left; }
  audio { height:36px; max-width:100%; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* home */
  .hero { text-align:center; padding:40px 8px 28px; }
  .hero .kh { font-family:'Noto Sans Khmer', sans-serif; font-size:44px; color:var(--accent); line-height:1.3; }
  .hero h2 { font-size:clamp(26px, 6vw, 40px); margin:8px 0; line-height:1.15; }
  .hero p { color:var(--muted); max-width:520px; margin:0 auto 18px; }
  .hero .row { justify-content:center; }
  .features { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .features .card { margin:0; }
  .features b { display:block; font-size:17px; }
  .features span { color:var(--muted); font-size:15px; }
  /* alphabet + games */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 4px; color:var(--ink); font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; }
  .tile .glyph { font-family:'Noto Sans Khmer', sans-serif; font-size:34px; line-height:1.4; }
  .tile small { color:var(--muted); font-size:12px; }
  .tile.o { background:var(--soft); }
  .match { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .match .tile { min-height:60px; justify-content:center; text-align:center; padding:8px; }
  .match .tile.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .match .tile.done { opacity:.35; cursor:default; }
  .match .tile.wrong { border-color:var(--bad); box-shadow:0 0 0 2px var(--bad); }
</style>
</head>

</header>

<script>
const main = document.getElementById('main');
const DATA = JSON.parse(document.getElementById('data').textContent);
const LESSONS = DATA.lessons;
const BY_ID = {};
[...LESSONS.flatMap(l => l.items), ...DATA.consonants, ...DATA.vowels].forEach(it => BY_ID[it.id] = it);
const DAY = 864e5, GAPS = [0, 1, 3, 7, 14, 30, 90]; // review gap in days per box
let srs = load('srs', {});   // id -> {box, due}
let done = load('done', []); // finished lesson indexes
let voice = load('voice', 'f');

function load(k, d) { try { return JSON.parse(localStorage.getItem('km-' + k)) ?? d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem('km-' + k, JSON.stringify(v)); } catch {} }
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const $ = id => document.getElementById(id);

function play(item) {
  const a = new Audio(`audio/${item.id}-${voice}.mp3`);
  a.play().catch(() => {
    // shortcut: browser voice fallback until the audio files exist; most devices have no Khmer voice
    const u = new SpeechSynthesisUtterance(item.km); u.lang = 'km-KH'; speechSynthesis.speak(u);
  });
  return a;
}

function phraseHTML(it) {
  return `<div class="rom">${it.rom}</div><div class="km">${it.km}</div><div class="en">${it.en}</div>` +
    (it.note ? `<div class="note">${it.note}</div>` : '');
}

// ---- Home ----
function home() {
  const next = LESSONS.findIndex((_, i) => !done.includes(i));
  const start = done.length && next >= 0
    ? `<button class="btn primary" id="cont">Continue: Day ${next + 1}</button>`
    : `<a class="btn primary" href="#lessons">Start learning</a>`;
  const features = [
    ['lessons', 'Daily lessons', `${LESSONS.length} short lessons from beginner to advanced, built around real family conversation.`],
    ['alphabet', 'Khmer alphabet', 'All 33 consonants and the common vowels, each with audio.'],
    ['review', 'Smart review', 'Flashcards come back right before you would forget them.'],
    ['quiz', 'Listening quiz', 'Hear a phrase and pick what it means.'],
    ['games', 'Word games', 'Quick matching games for phrases and letters.'],
    ['culture', 'Culture notes', 'Greetings, respect, family words and holidays.'],
  ];
  main.innerHTML = `<section class="hero"><div class="kh">សួស្តី</div>
    <h2>Speak Khmer with your family</h2>
    <p>Short daily lessons, real pronunciation, and practice that sticks. Free, no account needed.</p>
    <div class="row">${start}<a class="btn" href="#alphabet">Learn the alphabet</a></div></section>
    <div class="features">${features.map(([v, t, d]) => `<a class="card" href="#${v}"><b>${t}</b><span>${d}</span></a>`).join('')}</div>`;
  if ($('cont')) $('cont').onclick = () => lesson(next);
}

// ---- Lessons ----
function lessons() {
  let html = `<div class="narrow"><p class="hint">One lesson a day, then clear your reviews. Say every phrase out loud.</p>`, level;
  LESSONS.forEach((l, i) => {
    if (l.level !== level) { level = l.level; html += `<h3 class="level">${level}</h3>`; }
    const locked = i > 0 && !done.includes(i - 1);
    const status = done.includes(i) ? '✓ done' : locked ? '🔒' : `${l.items.length} phrases`;
    html += `<button class="lesson" data-i="${i}" ${locked ? 'disabled' : ''}><b>Day ${i + 1}: ${l.title}</b><span>${status}</span></button>`;
  });
  main.innerHTML = html + '</div>';
  main.querySelectorAll('.lesson').forEach(b => b.onclick = () => lesson(+b.dataset.i));
}

function lesson(i) {
  const l = LESSONS[i];
  main.innerHTML = `<div class="narrow"><h2>Day ${i + 1}: ${l.title}</h2><p class="hint">${l.level}. Play, repeat out loud, then record yourself to compare.</p>` +
    l.items.map(it => `<div class="card">${phraseHTML(it)}
      <div class="row"><button class="btn" data-play="${it.id}">▶ Play</button>
      <button class="btn" data-rec="${it.id}">🎙 Record</button><span id="out-${it.id}"></span></div></div>`).join('') +
    `<button class="btn primary" id="finish">Finish lesson → review</button></div>`;
  main.querySelectorAll('[data-play]').forEach(b => b.onclick = () => play(BY_ID[b.dataset.play]));
  main.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => record(BY_ID[b.dataset.rec], b));
  $('finish').onclick = () => {
    if (!done.includes(i)) done.push(i);
    l.items.forEach(it => srs[it.id] ??= { box: 0, due: 0 });
    save('done', done); save('srs', srs); location.hash = 'review';
  };
  scrollTo(0, 0);
}

// ---- Listen & repeat ----
let rec;
async function record(item, btn) {
  if (rec?.state === 'recording') return rec.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      btn.textContent = '🎙 Record';
      const mine = document.createElement('audio');
      mine.controls = true;
      mine.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      $('out-' + item.id).replaceChildren(mine);
      play(item).onended = () => mine.play(); // native speaker first, then you
    };
    rec.start();
    btn.textContent = '⏹ Stop';
  } catch {
    alert('Microphone not available. Allow mic access (needs https or localhost).');
  }
}

// ---- Alphabet ----
function alphabet(tab = 'c') {
  const list = tab === 'c' ? DATA.consonants : DATA.vowels;
  const hint = tab === 'c'
    ? 'Tap a letter to hear it. Each consonant belongs to a series: <b>a-series</b> (white) has a higher "â" sound, <b>o-series</b> (shaded) a lower "ô" sound. The series changes how the vowel after it sounds.'
    : 'Vowels attach to a consonant. Here they are shown on ក (kâ). After an o-series consonant, most vowels sound different.';
  main.innerHTML = `<div class="row" style="margin-top:0">
      <button class="btn ${tab === 'c' ? 'primary' : ''}" data-t="c">Consonants (33)</button>
      <button class="btn ${tab === 'v' ? 'primary' : ''}" data-t="v">Vowels</button></div>
    <p class="hint">${hint}</p>
    <div class="grid">${list.map(x => `<button class="tile ${x.series === 'o' ? 'o' : ''}" data-id="${x.id}">
      <span class="glyph">${x.km}</span><span>${x.rom}</span>${x.series ? `<small>${x.series}-series</small>` : ''}</button>`).join('')}</div>`;
  main.querySelectorAll('[data-t]').forEach(b => b.onclick = () => alphabet(b.dataset.t));
  main.querySelectorAll('.tile').forEach(b => b.onclick = () => play(BY_ID[b.dataset.id]));
}

// ---- Review (spaced repetition) ----
function review() {
  const queue = shuffle(Object.keys(srs).filter(id => srs[id].due <= Date.now() && BY_ID[id]));
  const next = () => {
    if (!queue.length) {
      main.innerHTML = `<div class="card big narrow"><div class="rom">All caught up 🎉</div>
        <p class="hint">${Object.keys(srs).length ? 'Come back tomorrow, or start the next lesson.' : 'Finish a lesson to get cards to review.'}</p></div>`;
      return;
    }
    const it = BY_ID[queue[0]];
    main.innerHTML = `<div class="narrow"><p class="hint">${queue.length} left. Say it in Khmer, then reveal.</p>
      <div class="card big"><div class="rom">${it.en}</div><div id="ans"></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="reveal">Reveal</button></div></div></div>`;
    $('reveal').onclick = () => {
      $('ans').innerHTML = `<hr><div class="rom">${it.rom}</div><div class="km">${it.km}</div>`;
      play(it);
      $('reveal').parentElement.innerHTML =
        `<button class="btn" id="rep">▶</button><button class="btn bad" id="again">Again</button><button class="btn ok" id="good">Got it</button>`;
      $('rep').onclick = () => play(it);
      $('again').onclick = () => { grade(it.id, false); queue.push(queue.shift()); next(); };
      $('good').onclick = () => { grade(it.id, true); queue.shift(); next(); };
    };
  };
  next();
}

function grade(id, ok) {
  const box = ok ? Math.min(srs[id].box + 1, GAPS.length - 1) : 0;
  srs[id] = { box, due: Date.now() + GAPS[box] * DAY };
  save('srs', srs);
}

const learned = () => Object.keys(srs).map(id => BY_ID[id]).filter(it => it?.en);

// ---- Listening quiz ----
function quiz() {
  const pool = learned();
  if (pool.length < 4) {
    main.innerHTML = `<div class="card big narrow"><p class="hint">Finish your first lesson to unlock the quiz.</p></div>`;
    return;
  }
  let right = 0, total = 0;
  const ask = () => {
    if (location.hash !== '#quiz') return; // left the page while waiting
    const it = pool[Math.floor(Math.random() * pool.length)];
    const opts = shuffle([it, ...shuffle(pool.filter(p => p !== it)).slice(0, 3)]);
    main.innerHTML = `<div class="narrow"><p class="hint">Score: ${right}/${total}. Listen and pick the meaning.</p>
      <div class="card big"><button class="btn primary" id="hear">▶ Play again</button><div id="reveal"></div></div>
      <div class="opts">${opts.map(o => `<button class="btn" data-id="${o.id}">${o.en}</button>`).join('')}</div></div>`;
    $('hear').onclick = () => play(it);
    play(it);
    main.querySelectorAll('.opts .btn').forEach(b => b.onclick = () => {
      total++;
      const ok = b.dataset.id === it.id;
      if (ok) right++;
      main.querySelectorAll('.opts .btn').forEach(x => { x.disabled = true; if (x.dataset.id === it.id) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      $('reveal').innerHTML = `<div style="margin-top:12px">${phraseHTML(it)}</div>`;
      setTimeout(ask, ok ? 1200 : 3000);
    });
  };
  ask();
}

// ---- Matching game ----
function games(mode = 'phrases') {
  const phrases = learned().length >= 5 ? learned() : LESSONS[0].items;
  const pairs = mode === 'letters'
    ? shuffle(DATA.consonants).slice(0, 5).map(c => ({ it: c, a: `<span class="glyph">${c.km}</span>`, b: c.rom }))
    : shuffle(phrases).slice(0, 5).map(p => ({ it: p, a: p.rom, b: p.en }));
  const tiles = side => shuffle(pairs).map(p => `<button class="tile" data-side="${side}" data-id="${p.it.id}">${side === 'a' ? p.a : p.b}</button>`);
  const left = tiles('a'), right = tiles('b');
  main.innerHTML = `<div class="narrow"><div class="row" style="margin-top:0">
      <button class="btn ${mode === 'phrases' ? 'primary' : ''}" data-m="phrases">Phrases</button>
      <button class="btn ${mode === 'letters' ? 'primary' : ''}" data-m="letters">Letters</button></div>
    <p class="hint">Tap one on each side to match them. ${mode === 'phrases' && learned().length < 5 ? 'Using Day 1 words until you finish a lesson.' : ''}</p>
    <div class="match">${left.map((l, i) => l + right[i]).join('')}</div><div id="win"></div></div>`;
  main.querySelectorAll('[data-m]').forEach(b => b.onclick = () => games(b.dataset.m));
  let sel = null, matched = 0;
  main.querySelectorAll('.match .tile').forEach(t => t.onclick = () => {
    if (t.classList.contains('done')) return;
    if (!sel || sel.dataset.side === t.dataset.side) {
      sel?.classList.remove('sel');
      sel = t; t.classList.add('sel');
      return;
    }
    if (sel.dataset.id === t.dataset.id) {
      [sel, t].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); });
      play(BY_ID[t.dataset.id]);
      if (++matched === pairs.length) {
        $('win').innerHTML = `<div class="card big"><div class="rom">Nice! 🎉</div><button class="btn primary" id="again">Play again</button></div>`;
        $('again').onclick = () => games(mode);
      }
    } else {
      const s = sel;
      [s, t].forEach(x => x.classList.add('wrong'));
      setTimeout(() => [s, t].forEach(x => x.classList.remove('wrong', 'sel')), 500);
    }
    sel = null;
  });
}

// ---- Culture ----
function culture() {
  main.innerHTML = `<div class="narrow"><p class="hint">Small things that matter when you speak with family.</p>` +
    DATA.culture.map(c => `<div class="card"><b>${c.title}</b><p style="margin:6px 0 0">${c.text}</p></div>`).join('') + '</div>';
}

// ---- Router ----
const VIEWS = { home, lessons, alphabet, review, quiz, games, culture };
function route() {
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + v));
  VIEWS[v]();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
const sel = $('voice');
sel.value = voice;
sel.onchange = () => { voice = sel.value; save('voice', voice); };
route();
</script>
